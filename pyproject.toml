[project]
name = "formcoach"
version = "0.1.0"
description = "Sensor-gated webcam form coaching: XIAO ESP32-S3 wrist wearable + MediaPipe pose + biomechanical rules (BDA 696, SDSU, Fall 2026)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
  { name = "Robert Ashe" },
  { name = "Ruby Rios Ramirez" },
  { name = "Rochelle Reyes" },
  { name = "Christian Byars" },
  { name = "Bryce Hall" },
]
# Core: everything needed for `make demo` in replay mode and for the public-data pipeline.
# Heavy or hardware-specific packages live in the extras below (see docs/DECISIONS.md ADR-0002).
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "duckdb>=1.0",
  "pyyaml>=6",
  "matplotlib>=3.9",
  "requests>=2.32",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# Live webcam + pose estimation (Checkpoint 3 onwards)
vision = ["mediapipe>=0.10.14", "opencv-python>=4.10"]
# Talking to the wearable (Checkpoint 4 onwards)
device = ["bleak>=0.22", "pyserial>=3.5"]
# Training the gate model and experiments (Checkpoint 2/5 onwards)
train = ["tensorflow>=2.16", "torch>=2.3", "optuna>=3.6"]
# Session dashboard + CPU counters for the gating benchmark
app = ["streamlit>=1.36", "psutil>=6"]
all = ["formcoach[vision,device,train,app]"]

[project.scripts]
formcoach = "formcoach.cli:app"

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8",
  "pytest-cov>=5",
  "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formcoach"]

# PyTorch: CPU-only wheels for every OS. Nobody on the team has a discrete GPU and the
# default PyPI Linux wheel drags in ~2.5 GB of CUDA packages.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks", "firmware", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]
