# Installed by `make setup` (pre-commit install). Runs on every commit; CI runs the same tools.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2000]  # fixtures are small; raw data never goes in git
      - id: no-commit-to-branch
        args: [--branch, main]  # work on a branch, open a PR
