; FormCoach wearable firmware — Seeed XIAO ESP32-S3 + GY-BMI160
; Build:   pio run                    (or: make fw-build from the repo root; CI does this)
; Flash:   pio run -t upload --upload-port COM5   (make fw-upload PORT=COM5)
; Monitor: pio device monitor -b 115200           (make fw-monitor PORT=COM5)
; Library compile tests (no hardware): pio run -e libtest_bmi160_dfrobot -e libtest_tflm_chirale ...
[platformio]
default_envs = xiao_esp32s3

[env]
platform = espressif32@^6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = time, default
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DFORMCOACH_FW_VERSION=\"1.0.0\"
  -Wall

; ---- the firmware (v1): in-tree BMI160 register driver, energy gate, BLE + serial CSV ----
[env:xiao_esp32s3]
build_src_filter = +<app/>
lib_deps =
  h2zero/NimBLE-Arduino@^2.1.0

; ---- candidate libraries, compile-tested in CI so hardware day can switch drivers (ADR-0020/0021) ----
[env:libtest_bmi160_dfrobot]
build_src_filter = +<libtest/bmi160_dfrobot.cpp>
lib_deps =
  dfrobot/DFRobot_BMI160@^1.0.0

[env:libtest_bmi160_hanyazou]
build_src_filter = +<libtest/bmi160_hanyazou.cpp>
lib_deps =
  https://github.com/hanyazou/BMI160-Arduino.git

[env:libtest_tflm_chirale]
build_src_filter = +<libtest/tflm_chirale.cpp>
lib_deps =
  https://github.com/spaziochirale/Chirale_TensorFlowLite.git

[env:libtest_tflm_arduino]
build_src_filter = +<libtest/tflm_arduino.cpp>
lib_deps =
  https://github.com/tensorflow/tflite-micro-arduino-examples.git

[env:libtest_tflm_tanaka]
build_src_filter = +<libtest/tflm_tanaka.cpp>
lib_deps =
  tanakamasayuki/TensorFlowLite_ESP32@^1.0.0
