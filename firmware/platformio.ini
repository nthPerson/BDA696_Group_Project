; FormCoach wearable firmware — Seeed XIAO ESP32-S3 + GY-BMI160
; Build:   pio run            (or: make fw-build from the repo root)
; Flash:   pio run -t upload  (hold BOOT, tap RESET, release BOOT if the port is not found)
; Monitor: pio device monitor (115200 baud)
[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
platform = espressif32@^6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = time, default
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DFORMCOACH_FW_VERSION=\"0.1.0\"
  -Wall
lib_deps =
  h2zero/NimBLE-Arduino@^2.1.0
  ; BMI160 driver and TFLite Micro library: chosen at Checkpoint 4/5, see docs/DECISIONS.md
