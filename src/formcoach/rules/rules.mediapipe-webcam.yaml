# FormCoach form rules for the LIVE WEBCAM demo (MediaPipe pose, `formcoach demo --camera/--video`).
# PROVISIONAL (ADR-0033). A copy of rules.yaml (the design defaults, which replay and the golden
# file keep using) with TWO curl thresholds changed; everything else, including press, raise and
# squat, is the unchanged design default because no webcam data exists for them yet.
#
#   CURL_PARTIAL_ROM  elbow_min > 75 / elbow_max < 140  ->  > 115.0 / < 128.079
#       The design values flag nearly every rep of known-good MM-Fit curls too (ADR-0022: the lifted
#       3-D pose compresses joint angles). Round 1 used the MM-Fit-calibrated 103.869 for elbow_min;
#       the first labeled strict set (runs/live/20261104-221856, 22 reps, one person) read up to
#       106.8 on the right arm, so round 2 moved it to 115: above that strict set, below the
#       barely-bending reps seen earlier (elbow_min 124 and 137), which stay flagged.
#       elbow_max < 128.079 is still the MM-Fit value (strict webcam reps read 144-157).
#   CURL_SWING        upper_arm_trunk_drift > 20 / elbow_drift_max > 0.15  ->  > 35 / > 0.35
#       Webcam readings are 5-10x the MM-Fit baseline (median 32 deg / 0.25 vs 3 deg / 0.03), so the
#       design values flag ~95% of reps. Round 1: 35 / 0.30, the ~70th percentile of 54 UNLABELED reps
#       (a guess). Round 2 labeled test (strict 221856, swingy-with-mixed-arms 222027): strict reps
#       read 25-33 deg / 0.18-0.31, so 35 deg held (0 of 22 strict flagged by it; 4 of 9 swingy reps
#       flagged, all by it) and elbow_drift_max was raised to 0.35 (its only strict hit was 0.31,
#       and it caught no swingy rep that arm drift did not).
#   ROUND 2 IS NOT VALIDATED: those numbers were adjusted using the same two runs that exposed the
#   misses, so they must be re-tested on new labeled runs (strict, every-rep-swung, half-range).
#
# Every metric name is a key of RepMetrics.metrics (src/formcoach/app/pipeline.py).
version: 1
pose_source: mediapipe-webcam-provisional

gate:            # laptop-side gate, same constants as firmware/include/protocol.h
  on_windows: 2
  off_windows: 12
  energy_threshold_ms2sq: 3.0

rep_segmentation:      # pose/reps.py; adaptive thresholds derive from the running angle range
  adaptive: true
  window_s: 6.0
  min_range_deg: 25.0
  frac: 0.3
  curl: {angle: elbow, mode: below, enter: 60.0, exit: 150.0}
  press: {angle: elbow, mode: below, enter: 90.0, exit: 160.0}
  raise: {angle: shoulder_abd, mode: above, enter: 75.0, exit: 40.0}
  squat: {angle: knee, mode: below, enter: 100.0, exit: 160.0}

exercises:
  curl:
    primary: elbow
    rules:
      - code: CURL_PARTIAL_ROM
        severity: warn
        message: "Curl through the full range: squeeze at the top and straighten at the bottom."
        when:   # any condition fires the rule
          - {metric: elbow_min, op: gt, threshold: 115.0}     # design default 75.0
          - {metric: elbow_max, op: lt, threshold: 128.079}   # design default 140.0
      - code: CURL_SWING
        severity: warn
        message: "Keep your upper arm still - the elbow is drifting forward."
        when:
          - {metric: upper_arm_trunk_drift, op: gt, threshold: 35.0}   # design default 20.0
          - {metric: elbow_drift_max, op: gt, threshold: 0.35}         # design default 0.15
      - code: CURL_TOO_FAST
        severity: info
        message: "Slow down - control the weight on the way down."
        when:
          - {metric: duration_s, op: lt, threshold: 1.0}
      - code: CURL_ASYMMETRY
        severity: info
        message: "Both arms should curl the same distance."
        requires: two_arm
        when:
          - {metric: elbow_asymmetry, op: gt, threshold: 20.0}
  press:
    primary: elbow
    rules:
      - code: PRESS_NO_LOCKOUT
        severity: warn
        message: "Press all the way up until your elbows lock out."
        when:
          - {metric: elbow_max, op: lt, threshold: 155.0}
      - code: PRESS_TRUNK_LEAN
        severity: warn
        message: "Brace your core - you are leaning back on the press."
        when:
          - {metric: trunk_incl_max, op: gt, threshold: 15.0}
      - code: PRESS_ASYMMETRY
        severity: info
        message: "Lock out both arms together at the top."
        requires: two_arm
        when:
          - {metric: elbow_top_asymmetry, op: gt, threshold: 20.0}
      - code: PRESS_TOO_FAST
        severity: info
        message: "Slow down - control the press."
        when:
          - {metric: duration_s, op: lt, threshold: 1.0}
  raise:
    primary: shoulder_abd
    rules:
      - code: RAISE_OVER
        severity: info
        message: "Stop at shoulder height - no need to raise above it."
        when:
          - {metric: abd_peak, op: gt, threshold: 100.0}
      - code: RAISE_PARTIAL
        severity: warn
        message: "Raise to shoulder height."
        when:
          - {metric: abd_peak, op: lt, threshold: 65.0}
      - code: RAISE_BENT_ELBOW
        severity: warn
        message: "Keep a soft, nearly straight elbow through the raise."
        when:
          - {metric: elbow_at_abd_peak, op: lt, threshold: 140.0}
      - code: RAISE_TOO_FAST
        severity: info
        message: "Slow down - lower the dumbbells under control."
        when:
          - {metric: duration_s, op: lt, threshold: 1.0}
  squat:
    primary: knee
    rules:
      - code: SQUAT_SHALLOW
        severity: warn
        message: "Go deeper - hips down to at least knee height."
        when:
          - {metric: knee_min, op: gt, threshold: 110.0}
          - {metric: hip_knee_height_at_bottom, op: gt, threshold: 0.0}
      - code: SQUAT_FORWARD_LEAN
        severity: warn
        message: "Keep your chest up - you are folding forward at the bottom."
        when:
          - {metric: trunk_incl_at_bottom, op: gt, threshold: 45.0}
      - code: SQUAT_KNEE_VALGUS
        severity: warn
        message: "Push your knees out over your toes."
        requires: frontal_view
        when:
          - {metric: knee_track_at_bottom, op: lt, threshold: -0.10}
      - code: SQUAT_TOO_FAST
        severity: info
        message: "Slow down - control the descent."
        when:
          - {metric: duration_s, op: lt, threshold: 1.2}
